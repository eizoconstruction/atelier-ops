<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Atelier Ops — Eizo Construction</title>
    <meta name="theme-color" content="#182231" />
    <meta name="description" content="Gestion privée des jobs, employés, documents, temps et kilométrage." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atelier Ops" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/app-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Écran de connexion -->
    <section id="loginScreen" class="login-screen" hidden>
      <form id="loginForm" class="login-card" novalidate>
        <div class="brand big"><div class="brand-mark">AO</div><div><strong>Atelier Ops</strong><span>Eizo Construction</span></div></div>
        <h1>Connexion</h1>
        <label class="field"><span>Courriel</span><input name="email" type="email" autocomplete="username" required /></label>
        <label class="field"><span>Mot de passe</span><input name="password" type="password" autocomplete="current-password" required /></label>
        <p id="loginError" class="form-error" hidden></p>
        <p id="loginInfo" class="form-info" hidden></p>
        <button id="loginSubmit" class="primary-btn full" type="submit">Se connecter</button>
        <button id="forgotBtn" class="link-btn" type="button">Mot de passe oublié ?</button>
        <hr />
        <button id="demoBtn" class="ghost-btn full" type="button">Essayer en mode démo (données fictives)</button>
      </form>
    </section>

    <!-- Application -->
    <div id="appShell" class="app-shell" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="brand"><div class="brand-mark">AO</div><div><strong>Atelier Ops</strong><span>Eizo Construction</span></div></div>
        <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
        <div class="sidebar-foot">
          <div class="me">
            <span class="avatar" id="meAvatar">?</span>
            <span><b id="meName">—</b><small id="meRole">—</small></span>
          </div>
          <div id="demoSwitch"></div>
          <button id="logoutBtn" class="ghost-btn dark full" type="button">Se déconnecter</button>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="backdrop"></div>
      <main class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
          <div class="topbar-title">
            <p class="eyebrow" id="viewSub"></p>
            <h1 id="viewTitle">Atelier Ops</h1>
          </div>
          <div class="topbar-actions" id="topActions"></div>
          <span class="conn" id="connStatus" title="État de la connexion"><i></i><span></span></span>
        </header>
        <div id="banner"></div>
        <section id="view" class="view"></section>
      </main>
      <nav class="bottom-nav" id="bottomNav" aria-label="Navigation mobile"></nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
